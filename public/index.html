<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0046ae"><link rel="manifest" href="/manifest.json"><title>Voyage Moldavie</title>
<style>
:root{--bg:#f4f5f9;--c:#fff;--t:#1a1d29;--m:#6b7080;--b:#0046ae;--y:#ffd200;--r:#cc092f;--l:#e2e5ee}
@media(prefers-color-scheme:dark){:root{--bg:#10131c;--c:#1a1f2d;--t:#eef0f6;--m:#9aa0b3;--l:#2a3042;--b:#6b9cf0}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{background:#0046ae;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;border-bottom:4px solid var(--y)}
header h1{margin:0;font-size:1.15rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
#st{font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:99px;background:#fff3;white-space:nowrap}
#cd{margin-top:6px;font-size:.95rem;opacity:.95}
main{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.m{color:var(--m);font-size:.85rem}.big{font-weight:700;font-size:1.05rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{flex:0 0 auto;border:1px solid var(--l);background:var(--c);color:var(--t);border-radius:12px;padding:6px 12px;text-align:center;font-size:.8rem}
.chip.on{background:var(--b);color:#fff;border-color:var(--b)}.chip b{display:block;font-size:1rem}
.fl{border-left:4px solid var(--y)}
button,input,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--l);background:var(--bg);border-radius:10px;padding:7px 12px}
.btn.ok{background:#1a8f4a;color:#fff;border-color:#1a8f4a}
.pr{color:var(--r);font-weight:700}
a{color:var(--b)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:14px 4px;font-weight:600;color:var(--m)}
nav button.on{color:var(--b);box-shadow:inset 0 3px var(--b)}
#fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--r);color:#fff;font-size:2rem;box-shadow:0 4px 12px #0005}
dialog{border:0;border-radius:16px;padding:16px;width:min(94vw,460px);background:var(--c);color:var(--t)}
dialog::backdrop{background:#0008}
label{display:block;font-size:.8rem;color:var(--m);margin-top:10px}
input,textarea{width:100%;padding:9px;border:1px solid var(--l);border-radius:10px;background:var(--bg)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style></head><body>
<header><h1><span>🇲🇩 Voyage en Moldavie</span><span id="st"></span></h1><div id="cd"></div></header>
<main id="main"></main>
<button id="fab" onclick="openF()" aria-label="Ajouter">+</button>
<nav><button id="t-agenda" onclick="setTab('agenda')">📅 Agenda</button><button id="t-vols" onclick="setTab('vols')">✈️ Vols</button></nav>
<dialog id="dlg"><form onsubmit="saveF(event)">
<input type="hidden" id="fid">
<label>Activité</label><input id="ft" required placeholder="Ex. Visite de Cricova">
<div class="g2"><div><label>Date</label><input id="fd" type="date" required></div><div><label>Heure</label><input id="fh" type="time"></div></div>
<div class="g2"><div><label>Prix (€)</label><input id="fp" type="number" step="0.01" min="0" inputmode="decimal"></div><div><label>Site web</label><input id="fu" placeholder="https://…"></div></div>
<label>Adresse</label><input id="fa" placeholder="Rue, ville">
<label>Notes</label><textarea id="fn" rows="2"></textarea>
<div class="row" style="margin-top:14px"><button type="button" class="btn" id="fdel" onclick="delF()" style="color:var(--r)">Supprimer</button>
<span><button type="button" class="btn" onclick="dlg.close()">Annuler</button> <button class="btn ok">Enregistrer</button></span></div>
</form></dialog>
<script>
const K='moldavie_items',T='moldavie_token',$=s=>document.querySelector(s),dlg=$('#dlg');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SEED=[['f1','BOD','BER','Bordeaux','Berlin','2026-12-07 21:10','2026-12-07 23:10','easyJet U2 5154',1],
['f2','BER','WAW','Berlin','Varsovie','2026-12-08 11:25','2026-12-08 12:40','LOT LO388',1],
['f3','WAW','RMO','Varsovie','Chișinău','2026-12-08 14:55','2026-12-08 17:40','LOT LO515',1],
['f4','RMO','SOF','Chișinău','Sofia','2026-12-19 17:45','2026-12-19 19:20','Wizz Air W6 4460',2],
['f5','SOF','BCN','Sofia','Barcelone','2026-12-19 22:10','2026-12-20 00:10','Ryanair FR 6329',2],
['f6','BCN','BOD','Barcelone','Bordeaux','2026-12-20 07:40','2026-12-20 08:55','Vueling VY 8120',1]]
.map(([id,a,b,fa,fb,dep,arr,co,tz])=>({id,type:'flight',a,b,fa,fb,dep,arr,co,tz,done:false,updatedAt:1}));
let items=JSON.parse(localStorage.getItem(K)||'null')||SEED.slice(),tab='agenda';
const days=[];for(let d=new Date('2026-12-07T12:00');d<=new Date('2026-12-20T12:00');d.setDate(d.getDate()+1))days.push(d.toISOString().slice(0,10));
const today=new Date().toLocaleDateString('sv');let day=days.includes(today)?today:days[0];
const live=()=>items.filter(i=>!i.deleted),utc=f=>{const[d,t]=f.dep.split(' '),[y,m,da]=d.split('-').map(Number),[h,mi]=t.split(':').map(Number);return Date.UTC(y,m-1,da,h,mi)-f.tz*36e5};
const flights=()=>live().filter(i=>i.type==='flight').sort((a,b)=>utc(a)-utc(b)),acts=()=>live().filter(i=>i.type==='act');
const fmt=d=>new Date(d+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const eur=n=>n?n.toLocaleString('fr-FR',{style:'currency',currency:'EUR'}):'';
const link=u=>/^https?:\/\//i.test(u)?u:'https://'+u;
function save(){localStorage.setItem(K,JSON.stringify(items));render();sync()}
function put(o){const i=items.findIndex(x=>x.id===o.id);i<0?items.push(o):items[i]=o;save()}
function setS(s){$('#st').textContent={ok:'✓ Synchronisé',offline:'Hors ligne',wait:'…'}[s]}
async function sync(){
  if(!navigator.onLine)return setS('offline');setS('wait');
  try{const r=await fetch('/api/sync',{method:'POST',headers:{'Content-Type':'application/json','x-token':localStorage.getItem(T)||''},body:JSON.stringify({items})});
    if(r.status===401){const t=prompt('Code d’accès');if(t){localStorage.setItem(T,t);return sync()}return setS('offline')}
    if(!r.ok)throw 0;const d=await r.json(),m=new Map(items.map(i=>[i.id,i]));
    d.items.forEach(s=>{const l=m.get(s.id);if(!l||s.updatedAt>l.updatedAt)m.set(s.id,s)});
    items=[...m.values()];localStorage.setItem(K,JSON.stringify(items));render();setS('ok')}
  catch(e){setS('offline')}}
function setTab(t){tab=t;render()}
function cd(){const n=Date.now(),f=flights().find(f=>utc(f)>n);if(!f)return'Voyage terminé 🏠';
  const m=Math.floor((utc(f)-n)/6e4),j=Math.floor(m/1440),h=Math.floor(m%1440/60);
  return`Prochain vol (${f.a} → ${f.b}) dans ${j?j+' j ':''}${h} h ${m%60} min`}
const flCard=(f,full)=>`<div class="card fl"><div class="row"><span class="big">${f.a} → ${f.b}</span><span class="m">${esc(f.co)}</span></div>
<div class="m">${f.fa} → ${f.fb}</div><div class="row" style="margin-top:4px"><span>${f.dep.slice(11)} → ${f.arr.slice(11)}${f.arr.slice(0,10)!==f.dep.slice(0,10)?' (+1)':''}</span>
${full?`<button class="btn ${f.done?'ok':''}" onclick="chk('${f.id}')">${f.done?'✓ Enregistré':'Enregistrement ?'}</button>`:''}</div></div>`;
function chk(id){const f=items.find(i=>i.id===id);put({...f,done:!f.done,updatedAt:Date.now()})}
function render(){
  $('#cd').textContent=cd();$('#t-agenda').className=tab==='agenda'?'on':'';$('#t-vols').className=tab==='vols'?'on':'';$('#fab').style.display=tab==='agenda'?'':'none';
  let h='';
  if(tab==='vols'){let last='';flights().forEach(f=>{const d=f.dep.slice(0,10);if(d!==last){h+=`<h3 style="text-transform:capitalize">${fmt(d)}</h3>`;last=d}h+=flCard(f,1)});
    h+=`<p class="m">⚠️ Correspondances à Sofia et Barcelone : billets séparés, prévois du temps (attente de 7 h 30 à Sofia, nuit à l’aéroport). Horaires en heure locale.</p>`}
  else{
    const all=acts(),tot=all.reduce((s,a)=>s+(a.price||0),0),dt=all.filter(a=>a.date===day);
    h+=`<div class="chips">${days.map(d=>{const dd=new Date(d+'T12:00');return`<button class="chip ${d===day?'on':''}" onclick="day='${d}';render()">${dd.toLocaleDateString('fr-FR',{weekday:'short'})}<b>${dd.getDate()}</b></button>`}).join('')}</div>
    <div class="row m" style="margin-bottom:8px"><span style="text-transform:capitalize">${fmt(day)}</span><span>Jour : ${eur(dt.reduce((s,a)=>s+(a.price||0),0))||'0 €'} · Total : ${eur(tot)||'0 €'}</span></div>`;
    flights().filter(f=>f.dep.startsWith(day)).forEach(f=>h+=flCard(f,0));
    dt.sort((a,b)=>(a.time||'').localeCompare(b.time||'')).forEach(a=>h+=`<div class="card"><div class="row"><span class="big">${a.time?a.time+' · ':''}${esc(a.title)}</span><span class="pr">${eur(a.price)}</span></div>
      ${a.addr?`<div>📍 <a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(a.addr)}">${esc(a.addr)}</a></div>`:''}
      ${a.url?`<div>🔗 <a target="_blank" rel="noopener" href="${esc(link(a.url))}">Site web</a></div>`:''}${a.notes?`<div class="m">${esc(a.notes)}</div>`:''}
      <div style="margin-top:6px"><button class="btn" onclick="openF('${a.id}')">Modifier</button></div></div>`);
    if(!dt.length)h+=`<p class="m" style="text-align:center">Rien de prévu — appuie sur + pour ajouter une activité.</p>`}
  $('#main').innerHTML=h}
function openF(id){const a=id?items.find(i=>i.id===id):{};
  $('#fid').value=a.id||'';$('#ft').value=a.title||'';$('#fd').value=a.date||day;$('#fh').value=a.time||'';$('#fp').value=a.price||'';$('#fu').value=a.url||'';$('#fa').value=a.addr||'';$('#fn').value=a.notes||'';
  $('#fdel').style.display=id?'':'none';dlg.showModal()}
function saveF(e){e.preventDefault();const o={id:$('#fid').value||'a'+Date.now().toString(36),type:'act',title:$('#ft').value.trim(),date:$('#fd').value,time:$('#fh').value,price:parseFloat($('#fp').value)||0,url:$('#fu').value.trim(),addr:$('#fa').value.trim(),notes:$('#fn').value.trim(),updatedAt:Date.now()};
  if(days.includes(o.date))day=o.date;put(o);dlg.close()}
function delF(){if(!confirm('Supprimer cette activité ?'))return;const a=items.find(i=>i.id===$('#fid').value);put({...a,deleted:true,updatedAt:Date.now()});dlg.close()}
addEventListener('online',sync);addEventListener('offline',()=>setS('offline'));setInterval(()=>$('#cd').textContent=cd(),6e4);
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
render();sync();
</script></body></html>
