</style></head><body>
<div class="hero"><div class="top"><h1>🇲🇩 Moldavie<small>Décembre 2026</small></h1><span id="st"></span></div><div id="cd"></div><div id="cdl"></div></div>

    const dts=[...new Set(all.filter(a=>cost(a)>0).map(a=>a.date))].sort(),v2=x=>String(x).replace('.',',');
    h+=`<div class="sum" style="margin-top:4px"><div class="m">Total du voyage<span class="big2" style="display:block">${eur(tot)}</span></div><div class="m">Par personne (${n})<span class="big2" style="display:block;color:var(--b)">${eur(tot/n)}</span></div></div>
    <div class="card"><div class="gs" style="margin:0 0 4px">Détail par poste</div>${Object.entries(cat).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]).map(e=>`<div class="row2"><span>${e[0]}</span><span><b>${eur(e[1])}</b> <span class="m">· ${eur(e[1]/n)}/pers.</span></span></div>`).join('')}</div>
    <div class="card"><div class="gs" style="margin:0 0 4px">Cumul jour par jour</div><div class="row2"><span>✈️ Billets d’avion</span><b>${eur(run)}</b></div>${dts.map(d=>{const v=all.filter(a=>a.date===d).reduce((s,a)=>s+cost(a),0);run+=v;return`<div class="row2"><span style="text-transform:capitalize">${fmtS(d)} <span class="m">+${eur(v)}</span></span><b>${eur(run)}</b></div>`}).join('')}</div>
    <div class="card"><div class="gs" style="margin:0 0 4px">Réglages</div><label>Nombre de personnes</label><input type="number" inputmode="numeric" min="1" value="${n}" onchange="setP(this.value)">
    <div class="g2"><div><label>Billets d’avion (€)</label><input type="text" inputmode="decimal" value="${v2(c.base)}" onchange="setF('base',this.value)"></div><div><label>Supplément (€)</label><input type="text" inputmode="decimal" value="${v2(c.extra)}" onchange="setF('extra',this.value)"></div></div>
    <label>Le montant des billets est pour</label><select onchange="setF('pp',this.value)"><option value="0">Tout le groupe</option><option value="1" ${c.pp?'selected':''}>1 personne</option></select></div>`}
  else if(tab==='guide'){
    h+=`<div class="gs" style="margin-top:4px">À voir autour de Chișinău</div>`+G.map((g,i)=>`<div class="card act"><div class="ico">${g.c}</div><div class="x"><div class="big">${g.t}</div><div class="m">${g.d}</div>
      <button class="btn pri" style="margin-top:8px" onclick="openG(${i})">+ Ajouter à l’agenda</button></div></div>`).join('')
    +`<div class="gs">Infos pratiques</div>`+INFO.map(i=>`<div class="card act"><div class="ico">${i[0]}</div><div class="x"><div class="big">${i[1]}</div><div class="m">${i[2]}</div></div></div>`).join('')
    +`<p class="m" style="text-align:center">Résumés d’après <a href="${WV}" target="_blank" rel="noopener">Wikivoyage</a> (CC BY-SA). Infos à vérifier avant le départ.</p>`}
  else{
    const all=acts(),dt=all.filter(a=>a.date<=day&&(a.end||a.date)>=day),k=a=>day===a.date?(a.time||'99:99'):'',tot=all.reduce((s,a)=>s+cost(a),0)+fcost(),Z=S(all),hint=v=>v?'':'<span style="display:block;font-size:.7rem;font-weight:400;opacity:.75">Touche pour saisir</span>';
    h+=`<div class="chips">${days.map(d=>{const dd=new Date(d+'T12:00'),has=all.some(a=>a.date<=d&&(a.end||a.date)>=d)||flights().some(f=>f.dep.startsWith(d));return`<button class="chip ${d===day?'on':''} ${has?'dot':''}" onclick="day='${d}';render()">${dd.toLocaleDateString('fr-FR',{weekday:'short'})}<b>${dd.getDate()}</b></button>`}).join('')}</div>
    <div class="sum"><div class="m">Ce jour<b>${eur(dt.filter(a=>a.date===day).reduce((s,a)=>s+cost(a),0))}</b></div><div class="m">🎟️ Activités<b>${eur(Z.a)}</b></div><div class="m">🛏️ Hébergement<b>${eur(Z.h)}</b></div><div class="m" onclick="boxEdit('c')">🚗 Location voiture<b>${eur(Z.c)}</b>${hint(Z.c)}</div><div class="m" onclick="boxEdit('f')">⛽ Essence<b>${eur(Z.f)}</b>${hint(Z.f)}</div><div class="m">✈️ Billets d’avion<b style="color:var(--b)">${eur(fcost())}</b></div><div class="m" style="background:color-mix(in srgb,var(--r) 14%,var(--c))">Total cumulé<b>${eur(tot)}</b></div><div class="m" style="background:color-mix(in srgb,var(--b) 16%,var(--c))">Par personne<b style="color:var(--b)">${eur(tot/people())}</b></div></div>
    <div class="gs" style="margin-top:0;text-transform:capitalize">${fmt(day)}</div>`;
    flights().filter(f=>f.dep.startsWith(day)).forEach(f=>h+=flCard(f,0));
    dt.sort((a,b)=>k(a).localeCompare(k(b))).forEach(a=>h+=`<div class="card act" onclick="openF('${a.id}')"><div class="ico">${a.cat||'✨'}</div><div class="x"><div class="row"><span class="big">${esc(a.title)}</span><span class="pr">${a.price?eur(cost(a))+(a.pp?' ('+people()+' pers.)':''):''}</span></div>
      <div class="m">${day===a.date?(a.time?(a.end?'Dès '+a.time:a.time):'Heure libre'):day===a.end?'Jusqu’à '+(a.etime||'la fin de journée'):'En cours'}${a.end&&day===a.date?' · jusqu’au '+a.end.slice(8)+'/'+a.end.slice(5,7):''}</div>
      ${a.addr?`<a class="tag" onclick="event.stopPropagation()" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(a.addr)}">📍 ${esc(a.addr)}</a>`:''}
      ${a.url?`<a class="tag" onclick="event.stopPropagation()" target="_blank" rel="noopener" href="${esc(link(a.url))}">🔗 Site web</a>`:''}${a.notes?`<div class="m" style="margin-top:6px">${esc(a.notes)}</div>`:''}</div></div>`);
    if(!dt.length)h+=`<div class="card m" style="text-align:center">Rien de prévu ce jour-là.<br>Appuie sur + ou pioche une idée dans le Guide 🧭</div>`}
  $('#main').innerHTML=h}
const TY=[['🛏️','Hôtel'],['🚗','Location'],['⛽','Essence'],['🚌','Transport'],['🍽️','Resto'],['🏛️','Visite'],['🍷','Cave'],['🌳','Nature'],['🛍️','Shopping'],['✨','Autre']];
$('#tiles').innerHTML=TY.map(t=>`<button type="button" class="tile" data-c="${t[0]}" onclick="tc('${t[0]}')"><span>${t[0]}</span>${t[1]}</button>`).join('');
const LB={'🛏️':['Arrivée','Heure d’arrivée','Départ','Heure de départ'],'🚗':['Retrait','Heure de retrait','Retour','Heure de retour']},LD=['Date','Heure','Jusqu’au','Heure de fin'];
function tc(c){$('#fc').value=c;document.querySelectorAll('.tile').forEach(b=>b.classList.toggle('on',b.dataset.c===c));
  const l=LB[c]||LD;['l1','l2','l3','l4'].forEach((id,i)=>$('#'+id).textContent=l[i]);$('#multi').style.display=(LB[c]||$('#fe').value)?'':'none'}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}
function openF(id,p){const a=id?items.find(i=>i.id===id):(p||{});$('#dh').textContent=id?'Modifier':'Nouvelle activité';
  $('#fid').value=id||'';$('#ft').value=a.title||'';$('#fd').value=a.date||day;$('#fh').value=a.time||'';$('#fe').value=a.end||'';$('#fz').value=a.etime||'';
  $('#fp').value=a.price?String(a.price).replace('.',','):'';$('#fm').value=a.pp?'1':'0';$('#fu').value=a.url||'';$('#fa').value=a.addr||'';$('#fn').value=a.notes||'';
  tc(a.cat||'✨');$('#fdel').style.display=id?'':'none';$('#sh').classList.add('open');document.body.style.overflow='hidden'}
function closeF(){$('#sh').classList.remove('open');document.body.style.overflow=''}
function boxEdit(k){const l=acts();
  if(k==='c'){const x=l.find(a=>a.id==='p-c1')||l.find(a=>a.cat==='🚗'&&a.end);return x?openF(x.id):openF('',{cat:'🚗',title:'Location de voiture',date:'2026-12-10',end:'2026-12-17'})}
  const x=l.find(a=>a.cat==='⛽');x?openF(x.id):openF('',{cat:'⛽',title:'Essence',date:'2026-12-10'})}
function openG(i){const g=G[i];openF('',{title:g.t,cat:g.c,addr:g.a})}
function saveF(e){e.preventDefault();const d=$('#fd').value,en=$('#fe').value,t=$('#ft').value.trim();
  if(!t||!d)return toast('Titre et date requis');if(en&&en<d)return toast('La fin est avant le début');
  const o={id:$('#fid').value||'a'+Date.now().toString(36),type:'act',title:t,cat:$('#fc').value,date:d,time:$('#fh').value,end:en,etime:$('#fz').value,price:num($('#fp').value),pp:$('#fm').value==='1',url:$('#fu').value.trim(),addr:$('#fa').value.trim(),notes:$('#fn').value.trim(),updatedAt:Date.now()};
  if(days.includes(d))day=d;tab='agenda';closeF();put(o);toast('✓ Enregistré')}
function delF(){if(!confirm('Supprimer cet élément ?'))return;const a=items.find(i=>i.id===$('#fid').value);closeF();put({...a,deleted:true,updatedAt:Date.now()});toast('Supprimé')}
addEventListener('online',sync);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});addEventListener('offline',()=>setS('offline'));setInterval(cd,6e4);
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
render();sync();
</script></body></html>
